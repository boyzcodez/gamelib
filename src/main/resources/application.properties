spring.application.name=gamelib

# IGDB credentials (Twitch app) - create one at https://dev.twitch.tv/console/apps
igdb.client-id=${IGDB_CLIENT_ID:}
igdb.client-secret=${IGDB_CLIENT_SECRET:}

# Loads credentials from secrets.properties if it exists (gitignored)
spring.config.import=optional:classpath:secrets.properties

spring.h2.console.enabled=true

spring.jpa.show-sql=true

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/tommik?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=tommik
spring.datasource.password=password
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=create

server.port=9094
spring.data.rest.base-path=/api
