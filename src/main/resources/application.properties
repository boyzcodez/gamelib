spring.application.name=gamelib

# IGDB credentials (Twitch app) - create one at https://dev.twitch.tv/console/apps
igdb.client-id=${IGDB_CLIENT_ID:}
igdb.client-secret=${IGDB_CLIENT_SECRET:}

# Loads credentials from secrets.properties if it exists (gitignored)
spring.config.import=optional:classpath:secrets.properties

spring.jpa.show-sql=true
server.port=9094
spring.data.rest.base-path=/api

# ---------- LOCAL (H2 in-memory) ----------
spring.h2.console.enabled=true
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

