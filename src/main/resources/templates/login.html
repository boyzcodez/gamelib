<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{fragments/header :: topbar('login')}"></div>

    <main class="login-page">
        <div class="login-box">
            <h1>Sign in</h1>

            <div class="alert alert-error" th:if="${param.error}">Invalid username or password.</div>
            <div class="alert alert-info" th:if="${param.logout}">You have been logged out.</div>
            <div class="alert alert-info" th:if="${param.registered}">Account created, you can now sign in.</div>

            <!-- Spring Security expects a POST to /login with fields "username" and "password" -->
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Account name</label>
                    <input type="text" id="username" name="username" autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password">
                </div>
                <button type="submit" class="btn">Sign in</button>
            </form>

            <p class="form-switch">No account? <a th:href="@{/signup}">Register</a></p>
        </div>
    </main>

</body>
</html>
