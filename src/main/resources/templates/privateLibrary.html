<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Library</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{fragments/header :: topbar('library')}"></div>

    <main class="container">
        <div class="page-header">
            <h1>My Library <span class="muted" th:text="'(' + ${#lists.size(games)} + ')'"></span></h1>
            <a class="btn btn-green" th:href="@{/searchLibrary}">+ Add games</a>
        </div>

        <p class="empty" th:if="${#lists.isEmpty(games)}">
            Your library is empty. <a th:href="@{/searchLibrary}">Search for games</a> to get started.
        </p>

        <div class="game-grid">
            <a th:each="game : ${games}" th:href="@{/library/game/{id}(id=${game.id})}" class="game-card">
                <img th:if="${game.coverImageUrl != null}" th:src="${game.coverImageUrl}" th:alt="${game.title}">
                <div th:if="${game.coverImageUrl == null}" class="no-image">No image</div>
                <p class="game-card-title" th:text="${game.title}" th:title="${game.title}"></p>
            </a>
        </div>
    </main>

</body>
</html>
